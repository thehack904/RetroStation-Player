<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RetroStation Player – Sign In</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .login-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .login-card {
      width: 100%;
      max-width: 22rem;
    }
    .login-card .brand-header {
      margin-bottom: 1.5rem;
    }
    .login-card .panel {
      padding: 1.5rem;
    }
    .login-card h2 {
      margin: 0 0 1.25rem;
      font-size: 1.125rem;
    }
    .login-field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-bottom: 1rem;
    }
    .login-field label {
      font-size: 0.875rem;
      font-weight: 600;
    }
    .login-field input {
      padding: 0.5rem 0.625rem;
      font-size: 1rem;
      border-radius: 4px;
      box-sizing: border-box;
      width: 100%;
    }
    .login-error {
      color: #c0392b;
      font-size: 0.875rem;
      margin-bottom: 0.75rem;
    }
    .login-submit {
      width: 100%;
      padding: 0.625rem;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <header class="brand-header">
        <div class="brand-lockup">
          <img class="brand-mark" src="/static/logo.png" alt="RetroStation Player">
          <p class="brand-overline">Browser-controlled IPTV display</p>
        </div>
      </header>
      <section class="panel">
        <h2>Sign In</h2>
        {% if error %}
          <p class="login-error" role="alert">{{ error }}</p>
        {% endif %}
        <form method="post" action="{{ url_for('login') }}">
          {% set next_url = request.args.get('next', '') %}
          {% if next_url and next_url.startswith('/') and not next_url.startswith('//') %}
            <input type="hidden" name="next" value="{{ next_url }}">
          {% endif %}
          <div class="login-field">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" autocomplete="username" required autofocus>
          </div>
          <div class="login-field">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="login-submit">Sign In</button>
        </form>
      </section>
    </div>
  </div>
</body>
</html>
